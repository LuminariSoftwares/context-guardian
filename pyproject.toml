[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "context-guardian"
version = "0.5.0"
description = "A tiny proxy in front of any OpenAI-compatible LLM backend that compacts conversation history before the context window fills, so local-model coding CLIs don't hard-die from overflow."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "LuminariSoftwares" }]
keywords = ["ollama", "local-llm", "llm", "openai-api", "proxy", "context-window", "context-management", "litellm", "mcp", "coding-assistant"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.urls]
Homepage = "https://github.com/LuminariSoftwares/context-guardian"
Repository = "https://github.com/LuminariSoftwares/context-guardian"
Changelog = "https://github.com/LuminariSoftwares/context-guardian/blob/main/CHANGELOG.md"
Issues = "https://github.com/LuminariSoftwares/context-guardian/issues"

[project.scripts]
context-guardian = "context_guardian:main"

[tool.setuptools]
py-modules = ["context_guardian"]

# Pytest configuration.
#
# WHY THIS FILE EXISTS
#     There was no pytest.ini, pyproject.toml, setup.cfg or conftest.py in this
#     repo. pytest-asyncio appears only in requirements-dev.txt, while the
#     README's install step is `pip install -r requirements.txt`. Without the
#     plugin installed, pytest does NOT run `async def` tests -- it warns,
#     SKIPS them, and exits 0.
#
#     Every test guarding the empty-summary data-loss bug is async. So a fresh
#     checkout following the README could run the suite, see green, and have
#     executed none of them. Same shape as the bug itself: a check that reports
#     success without checking the thing.
[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
filterwarnings = [
    # Everything stays visible but non-fatal: this repo targets whatever
    # fastapi/httpx a user already has, and turning their deprecations into
    # errors would fail the suite for reasons that are not our correctness.
    "default",
    # ...except a coroutine that was collected and never awaited. That is the
    # silent-skip failure above, and it must be an ERROR.
    #
    # Matched by MESSAGE, not by warning class. The first version of this file
    # named `pytest.PytestUnhandledCoroutineWarning`, which does not exist in
    # every pytest version -- and a bad filter here is a hard config error that
    # stops the suite from running at all. A message regex works across
    # versions and degrades to "matches nothing" rather than to a crash.
    "error:coroutine .* was never awaited",
]
