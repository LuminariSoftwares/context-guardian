name: Bug Report
description: Report an issue with context-guardian
title: "[Bug] "
labels: ["bug"]

body:
  - type: markdown
    attributes:
      value: "Thank you for reporting a bug. Please include specific details to help us reproduce and fix the issue."

  - type: input
    id: version
    attributes:
      label: "Version"
      description: "npm and/or PyPI version"
      placeholder: "0.1.0-alpha.6 (npm) / 0.6.0 (PyPI)"
    validations:
      required: true

  - type: dropdown
    id: install_path
    attributes:
      label: "Installation Method"
      description: "How did you install context-guardian?"
      options:
        - "DSH plugin (npm - dsh-context-guardian)"
        - "Python proxy (PyPI - context-guardian)"
        - "Other"
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: "Operating System"
      options:
        - "Windows"
        - "macOS"
        - "Linux"
        - "Other"

  - type: input
    id: versions
    attributes:
      label: "Python and Node Versions"
      description: "Output of 'python --version' and 'node --version'"
      placeholder: "Python 3.10.5, Node 22.19.0"

  - type: input
    id: model_backend
    attributes:
      label: "Model and Backend"
      description: "Model name, context window size, and LLM backend"
      placeholder: "qwen3-coder 30B on Ollama 0.5.0, num_ctx 32768"
    validations:
      required: true

  - type: textarea
    id: what_happened
    attributes:
      label: "What Happened"
      description: "What did you observe? Include error messages or unexpected behavior."
      placeholder: "Context was truncated incorrectly..."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "Expected Behavior"
      description: "What did you expect to happen?"
      placeholder: "The conversation should have been compacted to 75% of the original..."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: "Steps to Reproduce"
      description: "How can we reproduce the issue?"
      placeholder: |
        1. Start a session with context size 16000
        2. Send messages totaling 15000 tokens
        3. Notice that...

  - type: textarea
    id: logs
    attributes:
      label: "Logs and Output"
      description: "Error messages or diagnostic output. Please remove tokens, API keys, and sensitive conversation content."
      render: "text"
      placeholder: "Paste error messages, tracebacks, or log output here"

  - type: textarea
    id: diagnostics
    attributes:
      label: "Diagnostic Output"
      description: "Output of '/guardian' in DSH or 'python cg_doctor.py'"
      placeholder: "Paste the output here"
