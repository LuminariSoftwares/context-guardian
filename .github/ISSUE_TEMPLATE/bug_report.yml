name: Bug Report
description: Report an issue with context-guardian
title: "[Bug] "
labels: ["bug", "needs-info"]

body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. context-guardian is maintained by one person on a best-effort basis; see [SUPPORT.md](https://github.com/LuminariSoftwares/context-guardian/blob/main/SUPPORT.md). You will get an acknowledgement within a day. The exact command and the full output are what make a bug reproducible.

  - type: input
    id: version
    attributes:
      label: "Version"
      description: "Output of `context-guardian --version`. DSH plugin users: the npm version of dsh-context-guardian."
      placeholder: "context-guardian 0.6.0"
    validations:
      required: true

  - type: dropdown
    id: install_path
    attributes:
      label: "Installation Method"
      description: "How did you install context-guardian?"
      options:
        - "Python proxy (PyPI - context-guardian)"
        - "DSH plugin (npm - dsh-context-guardian)"
        - "Other"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: "Operating System"
      description: "Name and version."
      placeholder: "Windows 11 / macOS 14.5 / Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: python_version
    attributes:
      label: "Python Version"
      description: "Output of `python --version`"
      placeholder: "Python 3.11.9"
    validations:
      required: true

  - type: input
    id: model_backend
    attributes:
      label: "Model and Backend (optional)"
      description: "Model name, context window size, and LLM backend, if the bug involves a model."
      placeholder: "qwen3-coder 30B on Ollama, num_ctx 32768"

  - type: textarea
    id: command
    attributes:
      label: "The Exact Command"
      description: "The exact command you ran, copied as typed, including any environment variables."
      render: "shell"
      placeholder: "GUARDIAN_UPSTREAM_URL=http://localhost:11434/v1 context-guardian"
    validations:
      required: true

  - type: textarea
    id: output
    attributes:
      label: "Full Output"
      description: "The full output, not a summary. For an install or setup problem, include the output of `context-guardian-doctor`. Remove tokens, API keys and sensitive conversation content first."
      render: "text"
      placeholder: "Paste the complete output or traceback here"
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: "What You Expected"
      description: "What did you expect to happen instead?"
    validations:
      required: true

  - type: checkboxes
    id: quick_start
    attributes:
      label: "Before you submit"
      options:
        - label: "I ran the quick start as written"
          required: true
