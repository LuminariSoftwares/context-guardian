name: Feature Request
description: Suggest an enhancement to context-guardian
title: "[Enhancement] "
labels: ["enhancement"]

body:
  - type: markdown
    attributes:
      value: |
        Feature requests are welcome. They may be answered "later" or "not here", with the reason. Filing one is not a promise of a timeline. Requests that add runtime dependencies are out of scope; see [SUPPORT.md](https://github.com/LuminariSoftwares/context-guardian/blob/main/SUPPORT.md).

  - type: textarea
    id: goal
    attributes:
      label: "What You Are Trying to Do"
      description: "The task or workflow, not the feature you have in mind."
      placeholder: "I keep long sessions going with a 16k-token model and..."
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: "What You Tried"
      description: "Settings, workarounds or other tools you tried, and what happened."
    validations:
      required: true

  - type: textarea
    id: change
    attributes:
      label: "What Would Change"
      description: "What would be different for you if this existed? Include numbers if you have them."
    validations:
      required: true

  - type: input
    id: context
    attributes:
      label: "Model, Backend and Window Size (optional)"
      placeholder: "llama3 70B on vLLM, context window 4096"
