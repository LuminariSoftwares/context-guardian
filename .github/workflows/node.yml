name: node

# Third-party actions are pinned to a commit SHA, not a tag: a tag is mutable,
# and moving it runs new code in a job that has the repository and a token.
# The comment after each SHA is the tag it was at when it was pinned.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  node:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: npm install --no-package-lock --legacy-peer-deps
      - run: npm run check
      - run: npm run test:node
      - run: node examples/dsh-preset/smoke.mjs
