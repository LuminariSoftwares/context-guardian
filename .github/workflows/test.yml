name: tests

# Third-party actions are pinned to a commit SHA, not a tag. A tag is mutable:
# whoever owns the action can move v4 at any time and every workflow that
# trusts it runs the new code on the next push, with the repository checked out
# and the job's token in the environment. The comment after each SHA is the tag
# it was at when it was pinned.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # The three operating systems on 3.11, plus every Python version
        # pyproject.toml claims (requires-python = ">=3.10") on Ubuntu. The
        # README's "3.10+" badge is this matrix; nothing else backs it.
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.11"]
        include:
          - os: ubuntu-latest
            python-version: "3.10"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: ubuntu-latest
            python-version: "3.13"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pytest -v

  docker:
    # The image MCP hosts build (Glama's build check, for example). Building it
    # is half the check; the other half is that the server inside it still
    # speaks MCP, which is what a host actually does with the image.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - run: docker build -t context-guardian-mcp .
      - name: list tools over stdio
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"0"}}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | docker run -i --rm context-guardian-mcp > tools.json
          cat tools.json
          python3 - <<'PY'
          import json, sys
          replies = [json.loads(l) for l in open("tools.json") if l.strip()]
          by_id = {r.get("id"): r for r in replies}
          assert by_id[1]["result"]["serverInfo"]["name"] == "context-guardian", by_id[1]
          names = sorted(t["name"] for t in by_id[2]["result"]["tools"])
          assert names == ["get_proxy_status", "list_spans", "read_span", "search_spans"], names
          print("tools/list over stdio:", ", ".join(names))
          PY

  audit:
    # Advisories against what is actually installed. Both tools are allowed to
    # report; neither is allowed to be the reason a PR cannot land, because a
    # new advisory in a transitive dependency is news, not a regression in this
    # diff. `continue-on-error` keeps the finding visible in the run.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "22"
      - run: python -m pip install -r requirements-dev.txt pip-audit
      - run: python -m pip_audit --strict --progress-spinner off
        continue-on-error: true
      - run: npm install --no-package-lock --legacy-peer-deps
      - run: npm audit --omit=dev
        continue-on-error: true
